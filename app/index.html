<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131519">
<title>My leagues | RosterSwing</title>
<meta name="application-name" content="RosterSwing">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="../" aria-label="RosterSwing"><img class="brand-mark" src="../assets/favicon.svg" width="24" height="24" alt="RosterSwing"><img class="brand-word" src="../assets/wordmark.svg" width="96" height="16" alt=""><span class="brand-desc">Fantasy Basketball Tools</span></a>
    <div class="hcenter"><span id="hleague"></span><div class="seg" id="periods" role="group" aria-label="Period"></div></div>
    <div class="hright">
    <label class="langsel" title="Jezik / Language"><svg class="globe" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 3.8 5.8 3.8 9s-1.3 6.2-3.8 9c-2.5-2.8-3.8-5.8-3.8-9S9.5 5.8 12 3z"/></svg><select data-langsel aria-label="Jezik / Language"><option value="sr">Srpski</option><option value="en">English</option></select></label>
    <button type="button" class="pchip" data-action="profile" id="pchip"></button>
    </div>
  </div>
</header>

<div class="shell">
<aside id="sidenav"></aside>
<main class="wrap">
  <section id="home" class="only-home"></section>
  <div id="leaguebar" class="only-ws"></div>
  <div id="wshead" class="only-ws"></div>
  <div id="backbar" class="only-ws"></div>
  <div id="page" class="only-ws page-only"></div>
  <div id="tradetabs" class="only-ws trade-only"></div>
  <div class="status" id="status"></div>
  <div id="banner"></div>
  <div id="tradewarn" class="trade-only"></div>
  <div class="score trade-only" id="score"></div>
  <div class="teams trade-only" id="teams"></div>
  <div id="compare" class="trade-only"></div>
  <div id="nudge" class="trade-only"></div>
  <div id="report" class="trade-only"></div>
  <div id="myteam" class="trade-only"></div>
  <div id="oppteam" class="trade-only"></div>
  <div id="history" class="trade-only"></div>
  <footer class="appfoot"></footer>
</main>
</div>
<div id="bottomnav"></div>

<script src="../assets/app.js"></script>
</body>
</html>
