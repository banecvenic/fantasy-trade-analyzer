<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>Trade Analyzer 9-cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121418; --bg2:#181b21; --card:#1f232b; --card2:#262b34; --line:#323844;
  --text:#e9ecf1; --muted:#9aa3b2; --dim:#6b7383;
  --accent:#e1251b; --accent2:#ff4136;
  --win:#1f9d55; --win-bg:rgba(31,157,85,.18); --win-text:#5be38f;
  --lose:#d64545; --lose-bg:rgba(214,69,69,.16); --lose-text:#ff8a8a;
  --warn:#f0b429; --warn-bg:rgba(240,180,41,.14);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:rgba(18,20,24,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:8px;height:20px;background:var(--accent);border-radius:2px}
.brand small{color:var(--muted);font-weight:500;font-size:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
@media (max-width:640px){.seg{margin-left:0;width:100%;justify-content:space-between}.seg button{padding:6px 8px;font-size:12px}}

/* Status bar */
.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:12px 0}
.status .grow{flex:1}
.linkbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);cursor:pointer;font-size:12px}
.linkbtn:hover{color:var(--text);border-color:var(--dim)}
.banner{border-radius:var(--radius);padding:12px 14px;margin:12px 0;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--lose-bg);border:1px solid rgba(214,69,69,.4);color:#ffd0d0}
.banner.warn{background:var(--warn-bg);border:1px solid rgba(240,180,41,.35);color:#ffe7a8}
.banner button{background:var(--accent);border:0;color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scoreboard */
.score{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.score-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.score-team{display:flex;flex-direction:column;align-items:center;min-width:72px}
.score-team .nm{font-size:12px;color:var(--muted);font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-team .pts{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.score-team.lead .pts{color:var(--win-text)}
.score-team.lead .nm{color:var(--text)}
.score-sep{font-size:24px;color:var(--dim);font-weight:700}
.score-note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
.score-note b{color:var(--text)}
.score-empty{text-align:center;color:var(--muted);padding:6px 0}

/* Teams grid */
/* Timovi uvek jedan ispod drugog: sve kolone vidljive odjednom, kolone se poravnavaju između timova */
.teams{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:visible;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.card-h .dot{width:10px;height:10px;border-radius:50%;flex:none}
.team-name{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;font-weight:700;font-size:15px;min-width:0;flex:1}
.team-name:hover,.team-name:focus{border-color:var(--line);outline:none;background:var(--bg2)}
.team-badge{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.team-badge.lead{color:var(--win-text)}
.iconbtn{background:none;border:0;color:var(--dim);cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:16px}
.iconbtn:hover{background:var(--card2);color:var(--text)}

/* Search */
.search{position:relative;padding:10px 12px}
.search-in{position:relative}
.slot-search{padding-top:4px;display:flex;flex-direction:column;gap:4px}
.slot-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:3px;width:max-content}
tr.slot-d td{background:linear-gradient(rgba(214,69,69,.09),rgba(214,69,69,.09)),var(--card)}
tr.slot-w td{background:linear-gradient(rgba(31,157,85,.09),rgba(31,157,85,.09)),var(--card)}
tr.slot-d .slot-tag,.slot-d-tag{background:var(--lose-bg);color:var(--lose-text)}
tr.slot-w .slot-tag,.slot-w-tag{background:var(--win-bg);color:var(--win-text)}
.from{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.from select{background:var(--bg2);border:1px solid var(--line);border-radius:4px;font-size:10px;padding:0 2px;color:var(--text);max-width:80px}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 34px;outline:none;font-size:16px}
.search input:focus{border-color:var(--accent)}
.search input:disabled{opacity:.5}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card2);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:30;max-height:320px;overflow-y:auto;list-style:none;margin:0;padding:4px}
.dd li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.dd li[aria-selected="true"]{background:rgba(225,37,27,.18)}
.dd li .meta{color:var(--muted);font-size:12px}
.dd .empty{color:var(--muted);cursor:default;padding:10px}

/* Table */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--bg2)}
td{font-size:13px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--card);min-width:150px;width:300px;max-width:300px}
th:first-child{background:var(--bg2)}
tbody tr.nodata td{color:var(--dim)}
tbody tr.nodata td:first-child{color:var(--muted)}
tr.total td{font-weight:700;border-bottom:0;background:var(--card2)}
tr.total td:first-child{background:var(--card2)}
td.win{background:var(--win-bg)!important;color:var(--win-text)}
td.lose{background:var(--lose-bg)!important;color:var(--lose-text)}
td .sub{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:1px}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl .txt{min-width:0;display:flex;flex-direction:column}
.pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.pl .meta{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
/* tabele svih timova iste širine kolona, da se brojke poravnaju */
.teams table{table-layout:fixed;min-width:860px}
.teams th:not(:first-child),.teams td:not(:first-child){width:auto}
.av{width:30px;height:30px;border-radius:50%;background:var(--card2);flex:none;overflow:hidden;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.av img{width:130%;height:auto;margin-top:6px}
.inj{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--lose-bg);color:var(--lose-text)}
.inj.dtd{background:var(--warn-bg);color:var(--warn)}
.flag{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--warn-bg);color:var(--warn)}
.badge{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--card2);color:var(--muted);cursor:help;white-space:nowrap}
.badge.wk{background:rgba(59,130,246,.16);color:#8fb8ff}
.badge.gp-good{background:var(--win-bg);color:var(--win-text)}
.badge.gp-ok{background:var(--warn-bg);color:var(--warn)}
.badge.gp-bad{background:var(--lose-bg);color:var(--lose-text)}
#tip{position:fixed;z-index:100;max-width:260px;background:#0b0d10;border:1px solid var(--line);color:var(--text);font-size:12px;line-height:1.4;padding:7px 9px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;white-space:normal}
@media (max-width:640px){ .badge .frac{display:none} }
.rm{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px;font-size:14px;margin-left:auto;flex:none}
@media (max-width:640px){
  th:first-child,td:first-child{min-width:128px;width:150px;max-width:150px}
  .teams table{min-width:700px}
  .pl{gap:6px}
  .pl .av{width:24px;height:24px}
  .pl .nm{max-width:96px}
  .pl .txt{flex:1;overflow:hidden}
  .pl .meta{flex-wrap:wrap;row-gap:2px}
  th,td{padding:7px 6px}
}
.rm:hover{color:var(--accent2)}
.empty-team{padding:18px 12px;color:var(--dim);text-align:center;font-size:13px}
.card-warn{padding:8px 12px;font-size:12px;color:#ffe7a8;background:var(--warn-bg);border-top:1px solid rgba(240,180,41,.25);border-radius:0 0 var(--radius) var(--radius)}

th.catth,td.catth{cursor:pointer;user-select:none}
th.catth:hover{color:var(--text)}
th.punt,td.catth.punt{text-decoration:line-through;color:var(--dim)!important}
td.punt{opacity:.35;background:transparent!important;color:var(--muted)!important}
td.catth.punt{opacity:1;background:var(--card)!important}
.punt-note{color:var(--warn)}
td.mintd{cursor:help;color:var(--muted)}
td.min-drop{color:var(--lose-text)}
.mintrend{font-size:9px!important;letter-spacing:-.02em}
@media (max-width:640px){ .mintrend{display:none!important} }
.trend{font-size:11px;font-weight:800;margin-right:2px;cursor:help;padding:2px 1px}
.trend.good{color:var(--win-text)}
.trend.bad{color:var(--lose-text)}
.hint{font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim);font-size:11px}
.fold{margin-top:22px}
.fold summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;font-size:14px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:'▸';color:var(--accent);margin-right:8px;transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}
.fold summary span:first-of-type{flex:1}
.fold[open] summary{border-bottom:1px solid var(--line)}
.fold-body{padding-bottom:4px}
.myside{display:flex;align-items:center;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
.myside .lbl{font-size:12px;color:var(--muted)}
.seg.small{margin-left:0}
.seg.small button{padding:4px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
.chip small{color:var(--muted);font-size:10px}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 4px}
.chip button:hover{color:var(--accent2)}
.mytable td:first-child{min-width:110px}
.cnt{color:var(--muted);font-weight:500;font-size:11px}
.score-actions{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.hist-list{list-style:none;margin:0;padding:6px 8px}
.hist-list li{display:flex;align-items:center;gap:6px;border-radius:8px}
.hist-list li.active{background:rgba(225,37,27,.12)}
.hist-open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.hist-open:hover .hist-sides{color:var(--text)}
.hist-date{font-size:11px;color:var(--muted);font-weight:600}
.hist-sides{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-sides b{color:var(--text);font-weight:600}
.hist-detail{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.hist-dh{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-weight:700}
.hist-team{margin-bottom:10px}
.hist-tn{font-weight:700;font-size:13px;padding:4px 12px}
.addteam{border:1px dashed var(--line);border-radius:var(--radius);background:transparent;color:var(--muted);padding:14px;font-weight:600;cursor:pointer;min-height:56px}
.addteam:hover{border-color:var(--accent);color:var(--text)}

/* Compare + report */
.section-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
.cmp td:first-child,.cmp th:first-child{min-width:70px}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;line-height:1.6;font-size:14px}
.report p{margin:0 0 8px}
.report p:last-child{margin-bottom:0}
.report .w{color:var(--win-text);font-weight:600}
footer{color:var(--dim);font-size:11px;text-align:center;margin-top:28px}
.skeleton{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>Trade Analyzer <small>9-cat</small></div>
    <div class="seg" id="periods" role="group" aria-label="Period"></div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status"></div>
  <div id="banner"></div>
  <div id="tradewarn"></div>
  <div class="score" id="score"></div>
  <div class="teams" id="teams"></div>
  <div id="compare"></div>
  <div id="report"></div>
  <div id="myteam"></div>
  <div id="history"></div>
  <footer>Podaci: javni ESPN fantasy API (nezvaničan). Prosek po utakmici.</footer>
</main>

<script>
'use strict';
/* =====================================================================
   KONFIGURACIJA — sve što zavisi od (nezvaničnog) ESPN API-ja je ovde.
   ===================================================================== */
const CONFIG = (() => {
  const now = new Date();
  // Sezona = godina u kojoj se završava. Od oktobra (mesec index 9) je sledeća godina.
  const SEASON = now.getMonth() >= 9 ? now.getFullYear() + 1 : now.getFullYear();
  return {
    SEASON,
    API_URL: `https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/${SEASON}/segments/0/leaguedefaults/1?view=kona_player_info`,
    PLAYER_LIMIT: 600,
    // filterStatsForSplitTypeIds [0..3] izbacuje split 5 (po utakmicama), a ExternalIds
    // ostavlja samo prošlu i tekuću sezonu. Payload: ~24 MB -> ~0,6 MB (gzip).
    FILTER: {
      players: {
        limit: 600,
        sortPercOwned: { sortPriority: 1, sortAsc: false },
        filterStatsForSplitTypeIds: { value: [0, 1, 2, 3] },
        filterStatsForExternalIds: { value: [SEASON - 1, SEASON] },
      },
    },
    // Raspored NBA timova (datumi utakmica). Javan, CORS radi.
    SCHEDULE_URL: `https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/${SEASON}?view=proTeamSchedules_wl`,
    SCHEDULE_CACHE_KEY: `fbaTrade.schedule.v1.${SEASON}`,
    // Utakmica se računa kao odigrana kad prođe ovoliko od početka (izbegava utakmice u toku).
    GAME_DONE_AFTER_MS: 3.5 * 60 * 60 * 1000,
    PREV_SEASON_GAMES: 82,
    FETCH_TIMEOUT_MS: 25000,
    SLOW_NOTICE_MS: 5000,
    CACHE_KEY: `fbaTrade.players.v2.${SEASON}`,
    STATE_KEY: 'fbaTrade.state.v1',
    PUNT_KEY: 'fbaTrade.punt.v1',      // samo lokalno, ne ide u link
    MYTEAM_KEY: 'fbaTrade.myteam.v1',  // samo lokalno, ne ide u link
    HISTORY_KEY: 'fbaTrade.history.v1', // samo lokalno, ne ide u link
    // Statistika po utakmici (split 5) za izabrane igrače. NAPOMENA: filterStatsForExternalIds
    // izbacuje split 5 (externalId tih unosa je ID utakmice), zato se ovde ne koristi.
    GAMELOG_FILTER: ids => ({ players: { filterIds: { value: ids }, filterStatsForSplitTypeIds: { value: [5] } } }),
    CACHE_TTL_MS: 6 * 60 * 60 * 1000, // 6h
    HEADSHOT_URL: id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`,
    MAX_TEAMS: 4,
    DROPDOWN_MAX: 10,
  };
})();

/** Periodi: stats[].id = `${statSourceId}${statSplitTypeId}${season}` */
const PERIODS = [
  { key: 'season', label: 'Sezona',    statId: s => `00${s}` },
  { key: 'l7',     label: '7 dana',    statId: s => `01${s}` },
  { key: 'l15',    label: '15 dana',   statId: s => `02${s}` },
  { key: 'l30',    label: '30 dana',   statId: s => `03${s}` },
  { key: 'proj',   label: 'Projekcija',statId: s => `10${s}` },
];

/** Ključevi u averageStats */
/** MIN = '40' provereno: split 5 za utakmicu 401909879 (Wembanyama) = 27, isto kao ESPN gamelog. */
const STAT = { PTS: '0', BLK: '1', STL: '2', AST: '3', REB: '6', TO: '11', FGM: '13', FGA: '14', FTM: '15', FTA: '16', TPM: '17', MIN: '40', GP: '42' };
/** Stats id za celu prošlu sezonu (za trajnost) */
const PREV_SEASON_STAT_ID = `00${CONFIG.SEASON - 1}`;
/** Strelice trenda: poslednjih 15 dana vs sezona (prikaz samo u periodu "Sezona") */
const TREND = {
  RECENT_STAT_ID: `02${CONFIG.SEASON}`,
  MIN_GP: 4,            // bar 4 utakmice u 15 dana
  COUNT_REL: 0.15,      // counting kategorije: ±15%
  PCT_ABS: 0.03,        // FG% / FT%: ±3 procentna poena
  MIN_ABS: 0.1,         // i prikazane vrednosti moraju da se razlikuju (izbegava 0.1 -> 0.2 = +100%)
};
/** Minutaža: trend sezona -> 30 -> 15 -> 7 dana; upozorenje ako 15 dana pada > 3 min ispod sezone */
const MINUTES = { TREND_KEYS: ['season', 'l30', 'l15', 'l7'], DROP_ALERT: 3 };
/** Nedelja = ponedeljak–nedelja po američkom istočnom vremenu (kao ESPN fantasy nedelje),
 *  da utakmica u nedelju uveče (ET) ne pređe u sledeću nedelju po našem vremenu. */
const WEEK_TZ = 'America/New_York';
/** Pragovi boje za trajnost (GP%) */
const DURABILITY = { GOOD: 0.85, OK: 0.70 };

/** 9 kategorija, redosled kolona. type: 'sum' (zbir proseka) ili 'pct' (ponderisano). */
const CATS = [
  { key: 'PTS', label: 'PTS', type: 'sum' },
  { key: 'REB', label: 'REB', type: 'sum' },
  { key: 'AST', label: 'AST', type: 'sum' },
  { key: 'TPM', label: '3PM', type: 'sum' },
  { key: 'STL', label: 'STL', type: 'sum' },
  { key: 'BLK', label: 'BLK', type: 'sum' },
  { key: 'FGP', label: 'FG%', type: 'pct', made: 'FGM', att: 'FGA' },
  { key: 'FTP', label: 'FT%', type: 'pct', made: 'FTM', att: 'FTA' },
  { key: 'TO',  label: 'TO',  type: 'sum', lowerIsBetter: true },
];

/** proTeamId -> skraćenica (provereno preko ?view=proTeamSchedules_wl, 2027) */
const PRO_TEAMS = {
  0: 'FA', 1: 'ATL', 2: 'BOS', 3: 'NOP', 4: 'CHI', 5: 'CLE', 6: 'DAL', 7: 'DEN', 8: 'DET', 9: 'GSW',
  10: 'HOU', 11: 'IND', 12: 'LAC', 13: 'LAL', 14: 'MIA', 15: 'MIL', 16: 'MIN', 17: 'BKN', 18: 'NYK',
  19: 'ORL', 20: 'PHI', 21: 'PHX', 22: 'POR', 23: 'SAC', 24: 'SAS', 25: 'OKC', 26: 'UTA', 27: 'WAS',
  28: 'TOR', 29: 'MEM', 30: 'CHA',
};

/** defaultPositionId -> pozicija */
const POSITIONS = { 1: 'PG', 2: 'SG', 3: 'SF', 4: 'PF', 5: 'C' };

/** injuryStatus -> kratka oznaka (ACTIVE/NORMAL se ne prikazuju) */
const INJURY = {
  DAY_TO_DAY: { short: 'DTD', cls: 'dtd' }, QUESTIONABLE: { short: 'Q', cls: 'dtd' }, PROBABLE: { short: 'P', cls: 'dtd' },
  OUT: { short: 'O', cls: '' }, INJURY_RESERVE: { short: 'IR', cls: '' }, SUSPENSION: { short: 'SSPD', cls: '' },
};

const TEAM_COLORS = ['#e1251b', '#3b82f6', '#f0b429', '#a855f7'];
const TEAM_DEFAULT_NAMES = ['Tim A', 'Tim B', 'Tim C', 'Tim D'];

/* =====================================================================
   Pomoćne funkcije
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Uklanja dijakritike: Jokić -> jokic, Dončić -> doncic, Đ -> dj */
const norm = s => String(s).toLowerCase()
  .replace(/đ/g, 'dj').replace(/ø/g, 'o').replace(/ł/g, 'l').replace(/ß/g, 'ss')
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const fmt1 = v => (v == null ? '-' : v.toFixed(1));
const fmtPct = v => (v == null ? '-' : v.toFixed(3).replace(/^0/, ''));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* pun / blokiran */ } };
const timeAgo = ts => {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'upravo';
  if (m < 60) return `pre ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `pre ${h} h` : `pre ${Math.round(h / 24)} d`;
};

/* =====================================================================
   Podaci: učitavanje, kompaktovanje, keš
   ===================================================================== */
/** Iz sirovog ESPN igrača pravi mali objekat sa samo potrebnim poljima. */
function compactPlayer(raw) {
  const p = raw.player || raw;
  const stats = {};
  let prevGP = null;
  const wanted = new Set(PERIODS.map(per => per.statId(CONFIG.SEASON)));
  for (const s of p.stats || []) {
    if (s.id === PREV_SEASON_STAT_ID && s.averageStats) { prevGP = +s.averageStats[STAT.GP] || 0; continue; }
    if (!wanted.has(s.id) || !s.averageStats) continue;
    const a = s.averageStats, o = {};
    for (const [k, id] of Object.entries(STAT)) o[k] = +a[id] || 0;
    stats[s.id] = o;
  }
  return {
    id: p.id,
    name: p.fullName,
    tid: p.proTeamId,
    team: PRO_TEAMS[p.proTeamId] ?? '?',
    pos: POSITIONS[p.defaultPositionId] ?? '?',
    inj: p.injuryStatus || 'ACTIVE',
    prevGP,
    stats,
  };
}

/** Raspored: { [proTeamId]: [{ id: gameId, date: ms }] } sortirano po datumu */
async function fetchSchedule() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.SCHEDULE_URL, { signal: ctrl.signal });
    if (!res.ok) throw new Error(`raspored: HTTP ${res.status}`);
    const data = await res.json();
    const teams = {};
    for (const t of data?.settings?.proTeams || []) {
      if (!t.id) continue; // 0 = FA
      const games = new Map();
      for (const list of Object.values(t.proGamesByScoringPeriod || {}))
        for (const g of list) games.set(g.id, { id: g.id, date: g.date });
      teams[t.id] = [...games.values()].sort((a, b) => a.date - b.date);
    }
    if (!Object.keys(teams).length) throw new Error('raspored je prazan');
    return teams;
  } finally {
    clearTimeout(timer);
  }
}

async function loadSchedule(force = false) {
  const cached = lsGet(CONFIG.SCHEDULE_CACHE_KEY);
  if (cached?.teams) state.schedule = cached.teams;
  if (!force && cached?.teams && Date.now() - cached.ts < CONFIG.CACHE_TTL_MS) { render(); return; }
  try {
    const teams = await fetchSchedule();
    state.schedule = teams;
    lsSet(CONFIG.SCHEDULE_CACHE_KEY, { ts: Date.now(), teams });
  } catch (e) {
    console.warn('Raspored nije učitan:', e.message); // funkcije koje zavise od rasporeda koriste fallback
  }
  render();
}

async function fetchPlayers() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_URL, {
      headers: { 'X-Fantasy-Filter': JSON.stringify(CONFIG.FILTER) },
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error(`ESPN je vratio grešku ${res.status}`);
    const data = await res.json();
    const list = Array.isArray(data) ? data : data.players;
    if (!Array.isArray(list) || list.length === 0) throw new Error('ESPN je vratio praznu listu igrača');
    return list.map(compactPlayer).filter(p => p.id && p.name);
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('ESPN ne odgovara (isteklo vreme)');
    if (e instanceof TypeError) throw new Error('Mrežna greška — proveri internet konekciju');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- Trajnost (GP%) ---------- */
const gamesDone = tid => {
  const games = state.schedule?.[tid];
  if (!games) return null;
  const cutoff = Date.now() - CONFIG.GAME_DONE_AFTER_MS;
  let n = 0;
  for (const g of games) { if (g.date <= cutoff) n++; else break; }
  return n;
};

/**
 * Moguće utakmice = broj utakmica koje je igračev NBA tim odigrao (iz rasporeda).
 * APROKSIMACIJA (fallback kad raspored nije dostupan): najveći GP među igračima istog tima.
 */
function possibleGames(p) {
  const fromSchedule = gamesDone(p.tid);
  if (fromSchedule != null) return { n: fromSchedule, approx: false };
  let max = 0;
  const sid = PERIODS[0].statId(CONFIG.SEASON);
  for (const q of state.players) if (q.tid === p.tid) max = Math.max(max, q.stats[sid]?.GP || 0);
  return { n: max, approx: true };
}

function durability(p) {
  if (!p.tid) return null; // slobodan igrač: nema tima
  const gp = Math.round(p.stats[PERIODS[0].statId(CONFIG.SEASON)]?.GP || 0);
  const { n, approx } = possibleGames(p);
  if (!n) return null;
  const pct = Math.min(gp / n, 1);
  const shown = Math.round(pct * 100) / 100; // boja prati prikazani procenat (84.6% -> 85% = zeleno)
  const cls = shown >= DURABILITY.GOOD ? 'good' : shown >= DURABILITY.OK ? 'ok' : 'bad';
  return { gp, n, pct, cls, approx };
}

/* ---------- Utakmice ove nedelje ---------- */
const etDateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: WEEK_TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const etDate = ms => etDateFmt.format(ms); // "YYYY-MM-DD"
/** Datumi (ET) od ponedeljka do nedelje tekuće nedelje */
function currentWeekDates() {
  const [y, m, d] = etDate(Date.now()).split('-').map(Number);
  const today = new Date(Date.UTC(y, m - 1, d));
  const monOffset = (today.getUTCDay() + 6) % 7; // 0 = ponedeljak
  return Array.from({ length: 7 }, (_, i) => new Date(Date.UTC(y, m - 1, d - monOffset + i)).toISOString().slice(0, 10));
}
function weekGames(tid) {
  const games = state.schedule?.[tid];
  if (!games) return null;
  const week = new Set(currentWeekDates());
  const inWeek = games.filter(g => week.has(etDate(g.date)));
  const cutoff = Date.now() - CONFIG.GAME_DONE_AFTER_MS;
  return { total: inWeek.length, left: inWeek.filter(g => g.date > cutoff).length };
}
function weekGamesHTML(p) {
  if (!p.tid) return '';
  const w = weekGames(p.tid);
  if (!w) return '';
  const [mon, , , , , , sun] = currentWeekDates();
  const tip = `${w.total} ut. ove nedelje (${mon.slice(5).split('-').reverse().join('.')}–${sun.slice(5).split('-').reverse().join('.')}, pon–ned) · preostalo: ${w.left}`;
  return `<span class="badge wk" data-tip="${tip}">${w.total} ut.</span>`;
}

function durabilityHTML(p) {
  const d = durability(p);
  const prev = p.prevGP != null ? `prošla sezona: ${Math.round(p.prevGP)}/${CONFIG.PREV_SEASON_GAMES}` : 'prošla sezona: nema podataka';
  if (!d) return p.prevGP != null ? `<span class="badge" data-tip="${prev}">—</span>` : '';
  const pct = Math.round(d.pct * 100);
  const tip = `Ove sezone: ${d.gp}/${d.n} utakmica (${pct}%)${d.approx ? ' · približno, raspored nedostupan' : ''} · ${prev}`;
  return `<span class="badge gp-${d.cls}" data-tip="${esc(tip)}"><span class="frac">${d.gp}/${d.n} · </span>${pct}%</span>`;
}

/** Tim u trejdu: ids = igrači koje tim DOBIJA. from = od kog tima (samo kod 3+ timova).
 *  drops = "Izbacuješ" slotovi, waivers = "Waiver dodatak" slotovi. */
const newTeam = (i, name) => ({ name: name || TEAM_DEFAULT_NAMES[i], ids: [], from: {}, drops: [], waivers: [] });
const normTeam = (t, i) => ({ ...newTeam(i), ...t, name: t?.name || TEAM_DEFAULT_NAMES[i], ids: t?.ids || [], from: t?.from || {}, drops: t?.drops || [], waivers: t?.waivers || [] });

const ids = s => (s || '').split(',').map(Number).filter(Boolean);

function saveState() {
  state.teams.forEach((t, ti) => {
    const need = slotNeeds(ti);
    t.drops = t.drops.slice(0, need.drops);
    t.waivers = t.waivers.slice(0, need.waivers);
  });
  lsSet(CONFIG.STATE_KEY, { period: state.period, teams: state.teams });
  // Deljiv link: per=period, t=dobija po timu, d=izbacuje, w=waiver, f=id:odTima (samo 3+ timova)
  const q = new URLSearchParams();
  q.set('per', state.period);
  q.set('t', state.teams.map(tm => tm.ids.join(',')).join('|'));
  if (state.teams.some(tm => tm.drops.length)) q.set('d', state.teams.map(tm => tm.drops.join(',')).join('|'));
  if (state.teams.some(tm => tm.waivers.length)) q.set('w', state.teams.map(tm => tm.waivers.join(',')).join('|'));
  if (state.teams.length > 2) q.set('f', state.teams.map(tm => tm.ids.map(id => `${id}:${tm.from[id] ?? ''}`).join(',')).join('|'));
  history.replaceState(null, '', `#${q.toString().replace(/%7C/gi, '|').replace(/%2C/gi, ',').replace(/%3A/gi, ':')}`);
}

function loadState() {
  const saved = lsGet(CONFIG.STATE_KEY);
  const hash = new URLSearchParams(location.hash.slice(1));
  let teams = null, period = saved?.period;
  if (hash.has('t')) {
    const split = k => (hash.get(k) || '').split('|');
    const d = split('d'), w = split('w'), f = split('f');
    teams = split('t').slice(0, CONFIG.MAX_TEAMS).map((chunk, i) => {
      const from = {};
      for (const pair of (f[i] || '').split(',')) {
        const [id, ft] = pair.split(':');
        if (id && ft !== '' && ft != null) from[+id] = +ft;
      }
      return normTeam({ name: saved?.teams?.[i]?.name, ids: ids(chunk), drops: ids(d[i]), waivers: ids(w[i]), from }, i);
    });
    period = hash.get('per') || period;
  } else if (Array.isArray(saved?.teams)) {
    teams = saved.teams.map(normTeam);
  }
  state.teams = teams && teams.length >= 2 ? teams : [newTeam(0), newTeam(1)];
  state.period = PERIODS.some(p => p.key === period) ? period : 'season';
}

/* ---------- Neravnomerni trejdovi ---------- */
/** Od kog tima dolazi igrač koga dobija tim ti. Kod 2 tima uvek drugi tim. */
function originOf(ti, id) {
  const n = state.teams.length;
  if (n === 2) return 1 - ti;
  const f = state.teams[ti].from[id];
  return f != null && f !== ti && f < n ? f : (ti + 1) % n;
}
/** Igrači koje tim ti DAJE */
const givenBy = ti => state.teams.flatMap((t, j) => (j === ti ? [] : t.ids.filter(id => originOf(j, id) === ti)));

/** Koliko slotova treba: drops (dobija više nego što daje) ili waivers (dobija manje). */
function slotNeeds(ti) {
  const allHave = state.teams.every(t => t.ids.length > 0);
  if (!allHave) return { drops: 0, waivers: 0 };
  const diff = state.teams[ti].ids.length - givenBy(ti).length;
  return { drops: Math.max(0, diff), waivers: Math.max(0, -diff) };
}
/** Popunjeni slotovi, odsečeni na potreban broj */
function activeSlots(ti) {
  const need = slotNeeds(ti), t = state.teams[ti];
  return { drops: t.drops.slice(0, need.drops), waivers: t.waivers.slice(0, need.waivers), need };
}
const unfilledSlots = () => state.teams.reduce((n, _, ti) => {
  const a = activeSlots(ti);
  return n + (a.need.drops - a.drops.length) + (a.need.waivers - a.waivers.length);
}, 0);
const takenIds = () => new Set(state.teams.flatMap(t => [...t.ids, ...t.drops, ...t.waivers]));

/* =====================================================================
   Proračun
   ===================================================================== */
const currentStatId = () => PERIODS.find(p => p.key === state.period).statId(CONFIG.SEASON);

/** Statistika igrača za trenutni period ili null ako nema podataka (GP = 0). */
function playerLine(p) {
  const s = p?.stats[currentStatId()];
  return s && s.GP > 0 ? s : null;
}

/** Zbirovi tima. Igrači bez podataka se ne računaju. */
const SUM_KEYS = ['PTS', 'REB', 'AST', 'TPM', 'STL', 'BLK', 'TO', 'FGM', 'FGA', 'FTM', 'FTA'];

/** Pretvara zbirove u vrednosti kategorija. Procenti uvek preko made/att, nikad prosek procenata. */
function catValues(sum, counted) {
  const vals = {};
  for (const c of CATS) {
    vals[c.key] = c.type === 'pct'
      ? (sum[c.att] > 0 ? sum[c.made] / sum[c.att] : null)
      : (counted ? sum[c.key] : null);
  }
  return vals;
}

/**
 * Zbir: plus igrači se dodaju, minus igrači oduzimaju (i FGM/FGA, FTM/FTA).
 * lineOf(p) daje statistiku igrača ili null (nema podataka -> ne računa se, ide u missing).
 */
function sumPlayers(plusIds, minusIds = [], lineOf = playerLine) {
  const sum = Object.fromEntries(SUM_KEYS.map(k => [k, 0]));
  let counted = 0;
  const missing = [];
  const apply = (id, sign) => {
    const p = state.byId.get(id);
    const line = lineOf(p);
    if (!line) { missing.push(p ? p.name : `#${id}`); return; }
    if (sign > 0) counted++;
    for (const k of SUM_KEYS) sum[k] += sign * line[k];
  };
  plusIds.forEach(id => apply(id, 1));
  minusIds.forEach(id => apply(id, -1));
  return { sum, vals: catValues(sum, counted || minusIds.length > 0), counted, missing };
}

/** Zbirovi tima: dobijeni + waiver dodaci − izbačeni. */
function teamTotals(team, ti) {
  const { drops, waivers } = activeSlots(ti);
  return sumPlayers([...team.ids, ...waivers], drops);
}

/** Upoređuje na prikazanoj preciznosti, da boje odgovaraju brojevima koje korisnik vidi. */
const cmpKey = (cat, v) => (v == null ? null : Math.round(v * (cat.type === 'pct' ? 1000 : 10)));

/**
 * Za svaku kategoriju: rezultat po timu ('win' | 'lose' | ''), pobednik i razlika.
 * Učestvuju samo timovi sa bar jednim igračem koji ima podatke.
 */
function compare(totals) {
  const active = totals.map((t, i) => (t.counted > 0 ? i : -1)).filter(i => i >= 0);
  const res = { cats: {}, score: totals.map(() => 0), ties: 0, active };
  for (const cat of CATS) {
    const marks = totals.map(() => '');
    if (isPunt(cat)) { res.cats[cat.key] = { marks, winner: null, runnerUp: null, margin: null, punted: true }; continue; }
    const entries = active.map(i => ({ i, v: totals[i].vals[cat.key], k: cmpKey(cat, totals[i].vals[cat.key]) })).filter(e => e.k != null);
    let winner = null, margin = null, runnerUp = null;
    if (entries.length >= 2) {
      entries.sort((a, b) => (cat.lowerIsBetter ? a.k - b.k : b.k - a.k));
      const best = entries[0].k, worst = entries[entries.length - 1].k;
      if (best !== worst) {
        const bestOnes = entries.filter(e => e.k === best);
        const worstOnes = entries.filter(e => e.k === worst);
        if (bestOnes.length === 1) {
          winner = bestOnes[0].i;
          runnerUp = entries[1].i;
          // Razlika na prikazanoj preciznosti (17.0 - 16.3 = 0.7, ne 0.75 -> 0.8)
          margin = Math.abs(entries[0].k - entries[1].k) / (cat.type === 'pct' ? 1000 : 10);
          marks[winner] = 'win';
          res.score[winner]++;
        } else {
          res.ties++;
        }
        if (worstOnes.length === 1) marks[worstOnes[0].i] = 'lose';
      } else {
        res.ties++;
      }
    }
    res.cats[cat.key] = { marks, winner, runnerUp, margin };
  }
  return res;
}

    el.innerHTML = `<div class="spinner"></div><span>${state.slow ? 'ESPN sporo odgovara, još učitavam…' : 'Učitavam igrače sa ESPN-a…'}</span>`;

  const info = state.loadedAt
    ? `${state.players.length} igrača · ažurirano ${timeAgo(state.loadedAt)} · sezona ${CONFIG.SEASON - 1}-${String(CONFIG.SEASON).slice(2)}`

  el.innerHTML = `<span class="grow">${info}</span><button class="linkbtn" data-action="refresh" type="button">↻ Osveži podatke</button>`;
}

function renderBanner() {

    : `<div class="banner err"><span>✕ ${esc(state.error)}. Nema sačuvanih podataka.</span><button data-action="refresh" type="button">Pokušaj ponovo</button></div>`;

const puntNote = () => (state.punt.size ? ` · <span class="punt-note">punt ${CATS.filter(isPunt).map(c => c.label).join(', ')}</span>` : '');

function renderScore(totals, cmp) {
  const el = $('#score');
  if (cmp.active.length < 2) {
    el.innerHTML = `<div class="score-empty">${state.players.length || !state.loading ? 'Dodaj igrače u bar dva tima da vidiš poređenje.' : '<div class="skeleton" style="height:48px"></div>'}</div>`;
    return;
  }
  const max = Math.max(...cmp.score);
  const leaders = cmp.score.filter(s => s === max).length;
  const parts = state.teams.map((t, i) => {

  });
  const winnerIdx = leaders === 1 ? cmp.score.indexOf(max) : -1;
  el.innerHTML = `<div class="score-row">${parts.join('<span class="score-sep">:</span>')}</div>
    <div class="score-note">${winnerIdx >= 0 ? `Pobeđuje <b>${esc(state.teams[winnerIdx].name)}</b>` : 'Nerešeno'}${cmp.ties ? ` · ${cmp.ties} kat. nerešeno` : ''} · ${PERIODS.find(p => p.key === state.period).label}${puntNote()}</div>
    <div class="score-actions"><button type="button" class="linkbtn" data-action="save-trade">★ Sačuvaj trejd</button><button type="button" class="linkbtn" data-action="share">🔗 Kopiraj link</button></div>`;
}

function avatarHTML(p) {
  return `<span class="av" data-ini="${esc(initials(p.name))}"><img src="${CONFIG.HEADSHOT_URL(p.id)}" alt="" loading="lazy" onerror="this.parentNode.textContent=this.parentNode.dataset.ini"></span>`;
}

function injHTML(p) {
  const i = INJURY[p.inj];
  return i ? `<span class="inj ${i.cls}" title="${esc(p.inj)}">${i.short}</span>` : '';
}

/** Zaglavlje kategorije: klik = punt */
const catTh = c => `<th class="catth${puntCls(c)}" data-punt="${c.key}" title="${isPunt(c) ? 'Vrati kategoriju' : 'Punt: isključi iz rezultata'}">${c.label}</th>`;

function headerRow() {
  return `<tr><th>Igrač</th><th class="minth">MIN</th>${CATS.map(catTh).join('')}<th>GP</th></tr>`;
}

/** Strelica trenda za igrača i kategoriju, ili '' */
function trendHTML(p, c) {
  if (state.period !== 'season') return '';
  const s = p.stats[PERIODS[0].statId(CONFIG.SEASON)], r = p.stats[TREND.RECENT_STAT_ID];
  if (!s || !r || s.GP <= 0 || r.GP < TREND.MIN_GP) return '';
  let sv, rv, show, fmt;
  if (c.type === 'pct') {
    if (!(s[c.att] > 0 && r[c.att] > 0)) return '';
    sv = s[c.made] / s[c.att]; rv = r[c.made] / r[c.att];
    show = Math.abs(rv - sv) >= TREND.PCT_ABS;
    fmt = fmtPct;
  } else {
    sv = s[c.key]; rv = r[c.key];
    show = sv > 0 && Math.abs(rv - sv) / sv >= TREND.COUNT_REL && Math.abs(rv - sv) >= TREND.MIN_ABS;
    fmt = fmt1;
  }
  if (!show) return '';
  const up = rv > sv;
  const good = c.lowerIsBetter ? !up : up;
  return `<span class="trend ${good ? 'good' : 'bad'}" data-tip="${c.label} · poslednjih 15 dana: ${fmt(rv)}, sezona: ${fmt(sv)} (${Math.round(r.GP)} ut.)">${up ? '↑' : '↓'}</span>`;
}

/** MIN ćelija: minuti za izabrani period + kompaktan trend (sezona → 30 → 15 → 7 dana) */
function minutesCell(p, line) {
  const byKey = k => p.stats[PERIODS.find(x => x.key === k).statId(CONFIG.SEASON)];
  const trend = MINUTES.TREND_KEYS.map(k => { const st = byKey(k); return st && st.GP > 0 ? st.MIN : null; });
  const [season, , l15] = trend;
  const drop = season != null && l15 != null && season - l15 > MINUTES.DROP_ALERT;
  const known = trend.filter(v => v != null);
  const compact = trend.map(v => (v == null ? '–' : v.toFixed(1))).join(' → ');
  const tip = `Minuti · sezona / 30 / 15 / 7 dana: ${compact}${drop ? ` · pad ${(season - l15).toFixed(1)} min u 15 dana` : ''}`;
  const val = line ? fmt1(line.MIN) : '-';
  return `<td class="mintd ${drop ? 'min-drop' : ''}" ${known.length ? `data-tip="${esc(tip)}"` : ''}>${drop ? '↓' : ''}${val}${known.length > 1 ? `<span class="sub mintrend">${compact}</span>` : ''}</td>`;
}

const SLOT_LABEL = { d: { text: 'Izbacuješ', cls: 'slot-d' }, w: { text: 'Waiver dodatak', cls: 'slot-w' } };

function fromSelectHTML(ti, id) {
  if (state.teams.length <= 2) return '';
  const cur = originOf(ti, id);
  const opts = state.teams.map((t, j) => (j === ti ? '' : `<option value="${j}" ${j === cur ? 'selected' : ''}>${esc(t.name)}</option>`)).join('');
  return `<label class="from">od <select data-from="${ti}" data-id="${id}" aria-label="Od kog tima">${opts}</select></label>`;
}

/** kind: 'recv' (dobija), 'd' (izbacuje), 'w' (waiver) */
function playerRow(p, ti, kind = 'recv') {
  const line = playerLine(p);
  const sign = kind === 'd' ? '−' : '';
  const cells = CATS.map(c => {
    const cls = puntCls(c) ? ` class="${puntCls(c).trim()}"` : '';
    if (!line) return `<td${cls}>-</td>`;
    const tr = trendHTML(p, c);
    if (c.type === 'pct') return `<td${cls}>${tr}${fmtPct(line[c.att] > 0 ? line[c.made] / line[c.att] : null)}</td>`;
    return `<td${cls}>${tr}${sign}${fmt1(line[c.key])}</td>`;
  }).join('');
  const slot = SLOT_LABEL[kind];
  return `<tr class="${line ? '' : 'nodata'} ${slot ? slot.cls : ''}">
    <td><div class="pl">${avatarHTML(p)}<div class="txt">${slot ? `<span class="slot-tag">${slot.text}</span>` : ''}<span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="meta">${p.team} · ${p.pos} ${injHTML(p)} ${durabilityHTML(p)} ${weekGamesHTML(p)} ${line ? '' : '<span class="flag" title="Nema podataka za ovaj period, ne računa se">0 GP</span>'}</span>
      ${kind === 'recv' ? fromSelectHTML(ti, p.id) : ''}</div>
      <button class="rm" type="button" data-action="remove" data-kind="${kind}" data-team="${ti}" data-id="${p.id}" aria-label="Ukloni ${esc(p.name)}">✕</button></div></td>
    ${minutesCell(p, line)}${cells}<td>${line ? Math.round(line.GP) : '0'}</td></tr>`;
}

function searchBoxHTML(key, placeholder, label = '') {
  const disabled = !state.players.length;
  const ui = searchUI.get(key) || { query: '' };
  return `<div class="search ${label ? 'slot-search' : ''}">
    ${label}
    <div class="search-in">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" data-search="${key}" placeholder="${disabled ? (state.loading ? 'Učitavam igrače…' : 'Nema podataka') : placeholder}" autocomplete="off" autocorrect="off" spellcheck="false"
        value="${esc(ui.query)}" ${disabled ? 'disabled' : ''} role="combobox" aria-expanded="false" aria-controls="dd-${key}">
      <ul class="dd" id="dd-${key}" role="listbox" hidden></ul>
    </div>
  </div>`;
}

function totalRow(t, cmp, ti) {
  const cells = CATS.map(c => {
    const mark = cmp.cats[c.key].marks[ti];
    const v = t.vals[c.key];
    if (c.type === 'pct') {
      return `<td class="${mark}${puntCls(c)}">${fmtPct(v)}<span class="sub">${t.sum[c.made].toFixed(1)}/${t.sum[c.att].toFixed(1)}</span></td>`;
    }
    return `<td class="${mark}${puntCls(c)}">${fmt1(v)}</td>`;
  }).join('');
  return `<tr class="total"><td>Ukupno <span class="meta" style="color:var(--muted);font-weight:500;font-size:11px">(${t.counted})</span></td><td></td>${cells}<td></td></tr>`;
}

function renderTeams(totals, cmp) {
  const disabled = !state.players.length;
  const html = state.teams.map((team, ti) => {
    const t = totals[ti];
    const players = team.ids.map(id => state.byId.get(id)).filter(Boolean);
    const unknown = team.ids.length - players.length;
    const slots = activeSlots(ti);
    const slotRows = [...slots.drops.map(id => ['d', id]), ...slots.waivers.map(id => ['w', id])]
      .map(([k, id]) => (state.byId.get(id) ? playerRow(state.byId.get(id), ti, k) : '')).join('');
    const slotSearch = [
      slots.need.drops > slots.drops.length ? searchBoxHTML(`${ti}:d`, 'Koga izbacuješ sa rostera…',
        `<span class="slot-tag slot-d-tag">Izbacuješ ${slots.drops.length + 1}/${slots.need.drops}</span>`) : '',
      slots.need.waivers > slots.waivers.length ? searchBoxHTML(`${ti}:w`, 'Koga uzimaš sa waivera…',
        `<span class="slot-tag slot-w-tag">Waiver dodatak ${slots.waivers.length + 1}/${slots.need.waivers}</span>`) : '',
    ].join('');
    const lead = cmp.active.length >= 2 && cmp.score[ti] === Math.max(...cmp.score) && cmp.score.filter(s => s === cmp.score[ti]).length === 1;
    return `<section class="card" data-team-card="${ti}">
      <div class="card-h">
        <span class="dot" style="background:${TEAM_COLORS[ti]}"></span>
        <input class="team-name" data-team-name="${ti}" value="${esc(team.name)}" aria-label="Ime tima" maxlength="24">
        ${cmp.active.length >= 2 ? `<span class="team-badge ${lead ? 'lead' : ''}">${cmp.score[ti]} kat.</span>` : ''}
        ${ti >= 2 ? `<button class="iconbtn" type="button" data-action="remove-team" data-team="${ti}" aria-label="Ukloni tim">✕</button>` : ''}
      </div>
      ${searchBoxHTML(String(ti), 'Dodaj igrača…')}
      ${players.length
        ? `<div class="tscroll"><table><thead>${headerRow()}</thead><tbody>${players.map(p => playerRow(p, ti)).join('')}${slotRows}</tbody>
           <tfoot>${totalRow(t, cmp, ti)}</tfoot></table></div>`
        : `<div class="empty-team">${unknown ? 'Igrači iz linka nisu pronađeni u listi.' : 'Još nema igrača. Kucaj ime iznad.'}</div>`}
      ${slotSearch}
      ${t.missing.length && players.length ? `<div class="card-warn">⚠ Bez podataka za period „${PERIODS.find(p => p.key === state.period).label}“, ne računa se: ${t.missing.map(esc).join(', ')}</div>` : ''}
    </section>`;
  });
  if (state.teams.length < CONFIG.MAX_TEAMS) html.push(`<button class="addteam" type="button" data-action="add-team">+ Dodaj tim</button>`);
  $('#teams').innerHTML = html.join('');
}

function renderCompare(totals, cmp) {
  const el = $('#compare');
  if (cmp.active.length < 2) { el.innerHTML = ''; return; }
  const rows = CATS.map(c => {
    const r = cmp.cats[c.key];
    const tds = state.teams.map((_, i) => {
      const v = totals[i].vals[c.key];
      return `<td class="${r.marks[i]}${puntCls(c)}">${c.type === 'pct' ? fmtPct(v) : fmt1(v)}</td>`;
    }).join('');
    const diff = r.punted ? 'punt' : r.winner == null ? '–' : (c.type === 'pct' ? `${(r.margin * 100).toFixed(1)} pp` : r.margin.toFixed(1));
    return `<tr class="${r.punted ? 'punt-row' : ''}"><td class="catth${puntCls(c)}" data-punt="${c.key}" title="Klik: punt"><b>${c.label}</b></td>${tds}<td class="${puntCls(c).trim()}" style="color:var(--muted)">${diff}</td></tr>`;
  }).join('');
  el.innerHTML = `<div class="section-t">Poređenje kategorija <span class="hint">· klik na kategoriju = punt</span></div>
    <div class="card"><div class="tscroll"><table class="cmp"><thead><tr><th>Kat.</th>${state.teams.map((t, i) => `<th style="color:${TEAM_COLORS[i]}">${esc(t.name)}</th>`).join('')}<th>Razlika</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

function catMarginText(c, margin) {
  if (c.type === 'pct') return `+${(margin * 100).toFixed(1)} pp`;
  return `${c.lowerIsBetter ? '−' : '+'}${margin.toFixed(1)}`;
}

function renderReport(totals, cmp) {
  const el = $('#report');
  if (cmp.active.length < 2) { el.innerHTML = ''; return; }
  const multi = cmp.active.length > 2;
  const per = PERIODS.find(p => p.key === state.period).label.toLowerCase();
  const paras = [];
  const max = Math.max(...cmp.score);
  const leaders = cmp.active.filter(i => cmp.score[i] === max);
  const scoreStr = cmp.active.map(i => cmp.score[i]).join(':');
  paras.push(leaders.length === 1
    ? `Na osnovu proseka (${per}) <span class="w">${esc(state.teams[leaders[0]].name)}</span> dobija trejd ${scoreStr} po kategorijama.`
    : `Na osnovu proseka (${per}) trejd je izjednačen (${scoreStr}).`);

  for (const i of cmp.active) {
    const won = CATS.filter(c => cmp.cats[c.key].winner === i);
    const name = esc(state.teams[i].name);
    if (!won.length) { paras.push(`${name} ne osvaja nijednu kategoriju.`); continue; }
    const parts = won.map(c => {
      const r = cmp.cats[c.key];
      const vs = multi ? ` ispred ${esc(state.teams[r.runnerUp].name)}` : '';
      return `${c.label} (${catMarginText(c, r.margin)}${vs})`;
    });
    // Najtesnija pobeda (relativno) — korisno za trejd odluke
    const close = won.map(c => {
      const r = cmp.cats[c.key];
      const base = Math.abs(totals[i].vals[c.key]) || 1;
      return { c, rel: c.type === 'pct' ? r.margin / 0.02 : r.margin / base / 0.05 };
    }).filter(x => x.rel < 1).map(x => x.c.label);
    paras.push(`${name} dobija ${parts.join(', ')}.${close.length ? ` Tesno: ${close.join(', ')}.` : ''}`);
  }
  const tied = CATS.filter(c => !isPunt(c) && cmp.cats[c.key].winner == null).map(c => c.label);
  if (tied.length) paras.push(`Nerešeno: ${tied.join(', ')}.`);
  if (state.punt.size) paras.push(`Punt (ne računa se): ${CATS.filter(isPunt).map(c => c.label).join(', ')}.`);
  const missing = cmp.active.flatMap(i => totals[i].missing);
  if (missing.length) paras.push(`Napomena: bez podataka za ovaj period i ne računaju se: ${missing.map(esc).join(', ')}.`);
  el.innerHTML = `<div class="section-t">Izveštaj</div><div class="report">${paras.map(p => `<p>${p}</p>`).join('')}</div>`;
}

/* =====================================================================
   Moj tim: pre i posle trejda
   ===================================================================== */
/** Roster posle trejda: − dati igrači − izbačeni + dobijeni + waiver dodaci (moja strana). */
function myTeamAfter() {
  const side = state.my.side, roster = state.my.roster;
  const given = new Set(givenBy(side));
  const { drops, waivers } = activeSlots(side);
  const dropSet = new Set(drops);
  const after = [...roster.filter(id => !given.has(id) && !dropSet.has(id)), ...state.teams[side].ids, ...waivers];
  const notOnRoster = [...given, ...drops].filter(id => !roster.includes(id));
  return { after: [...new Set(after)], notOnRoster };
}

function renderMyTeam() {
  const el = $('#myteam');
  // ako je tim obrisan, vrati izbor strane na prvi tim
  if (state.my.side >= state.teams.length) state.my.side = 0;
  const side = state.my.side;
  const roster = state.my.roster.map(id => state.byId.get(id)).filter(Boolean);
  const sideBtns = state.teams.map((t, i) =>
    `<button type="button" data-my-side="${i}" aria-pressed="${i === side}">${esc(t.name)}</button>`).join('');
  const chips = roster.map(p => `<span class="chip">${esc(p.name)} <small>${p.team}·${p.pos}</small>
    <button type="button" data-action="roster-remove" data-id="${p.id}" aria-label="Ukloni ${esc(p.name)}">✕</button></span>`).join('');

  let table = '';
  if (roster.length) {
    const { after, notOnRoster } = myTeamAfter();
    const before = sumPlayers(state.my.roster), aft = sumPlayers(after);
    const cell = (c, t) => {
      const v = t.vals[c.key];
      return `<td class="${puntCls(c).trim()}">${c.type === 'pct' ? fmtPct(v) : fmt1(v)}${c.type === 'pct' ? `<span class="sub">${t.sum[c.made].toFixed(1)}/${t.sum[c.att].toFixed(1)}</span>` : ''}</td>`;
    };
    const diffCells = CATS.map(c => {
      const b = cmpKey(c, before.vals[c.key]), a = cmpKey(c, aft.vals[c.key]);
      if (a == null || b == null) return `<td class="${puntCls(c).trim()}">-</td>`;
      const d = (a - b) / (c.type === 'pct' ? 1000 : 10);
      const better = c.lowerIsBetter ? d < 0 : d > 0;
      const cls = d === 0 ? '' : better ? 'win' : 'lose';
      const txt = c.type === 'pct' ? `${d > 0 ? '+' : ''}${(d * 100).toFixed(1)} pp` : `${d > 0 ? '+' : ''}${d.toFixed(1)}`;
      return `<td class="${cls}${puntCls(c)}">${txt}</td>`;
    }).join('');
    const missing = [...new Set([...before.missing, ...aft.missing])];
    table = `<div class="tscroll"><table class="mytable"><thead><tr><th></th>${CATS.map(catTh).join('')}</tr></thead><tbody>
      <tr><td>Pre trejda <span class="cnt">(${before.counted})</span></td>${CATS.map(c => cell(c, before)).join('')}</tr>
      <tr><td>Posle trejda <span class="cnt">(${aft.counted})</span></td>${CATS.map(c => cell(c, aft)).join('')}</tr>
      <tr class="total"><td>Razlika</td>${diffCells}</tr></tbody></table></div>
      ${notOnRoster.length ? `<div class="card-warn">⚠ Daješ/izbacuješ igrače koji nisu na tvom rosteru (ne oduzimaju se): ${notOnRoster.map(id => esc(state.byId.get(id)?.name || id)).join(', ')}</div>` : ''}
      ${missing.length ? `<div class="card-warn">⚠ Bez podataka za izabrani period, ne računa se: ${missing.map(esc).join(', ')}</div>` : ''}`;
  }

  el.innerHTML = `<details class="card fold" data-fold="my" ${state.my.open ? 'open' : ''}>
    <summary><span>Moj tim: pre i posle</span><span class="hint">${roster.length ? `${roster.length} igrača` : 'dodaj roster'}</span></summary>
    <div class="fold-body">
      <div class="myside"><span class="lbl">Moja strana trejda:</span><div class="seg small">${sideBtns}</div></div>
      ${searchBoxHTML('roster', 'Dodaj igrača na svoj roster…')}
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${table || '<div class="empty-team">Dodaj ceo svoj roster da vidiš kako ga trejd menja.</div>'}
    </div>
  </details>`;
}

/* =====================================================================
   Istorija trejdova
   ===================================================================== */
const clone = o => JSON.parse(JSON.stringify(o));
const fmtDate = iso => new Date(iso).toLocaleDateString('sr-Latn', { day: 'numeric', month: 'numeric', year: 'numeric' });
const tradePlayerIds = teams => [...new Set(teams.flatMap(t => [...t.ids, ...t.drops, ...t.waivers]))];

/** Link sadrži samo trejd (strane, slotove, period). Moj tim, istorija i punt ostaju lokalno. */
async function shareLink(btn) {
  saveState();
  const url = location.href;
  try {
    if (navigator.share && matchMedia('(hover: none)').matches) await navigator.share({ title: 'Trejd', url });
    else { await navigator.clipboard.writeText(url); btn.textContent = '✓ Link kopiran'; setTimeout(() => render(), 1500); }
  } catch (e) {
    if (e.name !== 'AbortError') prompt('Kopiraj link:', url);
  }
}

function saveTrade() {
  const totals = state.teams.map(teamTotals);
  state.history.unshift({
    id: Date.now(),
    date: new Date().toISOString(),
    period: state.period,
    teams: clone(state.teams),
    names: Object.fromEntries(tradePlayerIds(state.teams).map(id => [id, state.byId.get(id)?.name || `#${id}`])),
    snapshot: totals.map(t => ({ vals: t.vals, sum: t.sum, counted: t.counted })),
  });
  saveHistory();
  state.histOpen = true;
  render();
}

function openTrade(id) {
  const h = state.history.find(x => x.id === id);
  if (!h) return;
  state.teams = clone(h.teams).map(normTeam);
  state.period = h.period;
  state.histView = id;
  state.histOpen = true;
  saveState();
  render();
  loadGameLogs(tradePlayerIds(h.teams));
  $('#history').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deleteTrade(id) {
  const h = state.history.find(x => x.id === id);
  if (!h || !confirm(`Obrisati sačuvani trejd od ${fmtDate(h.date)}?`)) return;
  state.history = state.history.filter(x => x.id !== id);
  if (state.histView === id) state.histView = null;
  saveHistory();
  render();
}

/** Statistika po utakmici (split 5) za date igrače; datum utakmice iz rasporeda (ID utakmice). */
async function loadGameLogs(ids) {
  const need = ids.filter(id => !state.gameLogs.has(id));
  if (!need.length) { render(); return; }
  state.gameLogStatus = { loading: true, error: null };
  render();
  try {
    if (!state.schedule) await loadSchedule();
    if (!state.schedule) throw new Error('raspored nije dostupan (potreban za datume utakmica)');
    const gameDate = new Map(Object.values(state.schedule).flat().map(g => [String(g.id), g.date]));
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
    const res = await fetch(CONFIG.API_URL, { headers: { 'X-Fantasy-Filter': JSON.stringify(CONFIG.GAMELOG_FILTER(need)) }, signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`ESPN je vratio grešku ${res.status}`);
    const data = await res.json();
    for (const raw of data.players || []) {
      const p = raw.player, games = [];
      for (const st of p.stats || []) {
        if (st.statSplitTypeId !== 5 || st.seasonId !== CONFIG.SEASON || !st.stats) continue;
        const date = gameDate.get(String(st.externalId));
        if (date == null) continue; // utakmica nije u rasporedu -> ne možemo pouzdano da je datiramo
        const line = {};
        for (const [k, sid] of Object.entries(STAT)) line[k] = +st.stats[sid] || 0;
        if (line.GP > 0) games.push({ date, line });
      }
      state.gameLogs.set(p.id, games.sort((a, b) => a.date - b.date));
    }
    for (const id of need) if (!state.gameLogs.has(id)) state.gameLogs.set(id, []);
    state.gameLogStatus = { loading: false, error: null };
  } catch (e) {
    state.gameLogStatus = { loading: false, error: e.name === 'AbortError' ? 'ESPN ne odgovara' : e.message };
  }
  render();
}

/** Prosek igrača samo za utakmice POSLE datuma trejda (utakmice tog dana se ne računaju). */
function sinceLine(p, sinceMs) {
  const games = state.gameLogs.get(p?.id);
  if (!games) return null;
  const after = games.filter(g => g.date > sinceMs);
  if (!after.length) return null;
  const avg = { GP: after.length };
  for (const k of [...SUM_KEYS, 'MIN']) avg[k] = after.reduce((a, g) => a + g.line[k], 0) / after.length;
  return avg;
}

function renderHistory() {
  const el = $('#history');
  const list = state.history.map(h => {
    const sides = h.teams.map(t => `<b>${esc(t.name)}</b>: ${t.ids.map(id => esc(h.names?.[id] || state.byId.get(id)?.name || id)).join(', ') || '–'}`).join(' ⇄ ');
    const per = PERIODS.find(x => x.key === h.period)?.label || h.period;
    return `<li class="${state.histView === h.id ? 'active' : ''}">
      <button type="button" class="hist-open" data-action="hist-open" data-id="${h.id}">
        <span class="hist-date">${fmtDate(h.date)} · ${per}</span><span class="hist-sides">${sides}</span></button>
      <button type="button" class="iconbtn" data-action="hist-del" data-id="${h.id}" aria-label="Obriši trejd">🗑</button></li>`;
  }).join('');

  let detail = '';
  const h = state.history.find(x => x.id === state.histView);
  if (h) {
    const since = new Date(h.date).getTime();
    const per = PERIODS.find(x => x.key === h.period)?.label || h.period;
    const st = state.gameLogStatus;
    const nowP = state.period;
    const blocks = h.teams.map((t0, ti) => {
      const t = normTeam(t0, ti);
      const plus = [...t.ids, ...t.waivers], minus = t.drops;
      const snap = h.snapshot[ti];
      const cur = sumPlayers(plus, minus);
      const sinceT = sumPlayers(plus, minus, p => sinceLine(p, since));
      const gamesSince = plus.map(id => sinceLine(state.byId.get(id), since)?.GP || 0);
      const row = (label, tt, cls = '') => `<tr class="${cls}"><td>${label}</td>${CATS.map(c => {
        const v = tt?.vals?.[c.key];
        return `<td class="${puntCls(c).trim()}">${c.type === 'pct' ? fmtPct(v) : fmt1(v)}</td>`;
      }).join('')}</tr>`;
      const sinceLabel = st.loading ? 'Od trejda: učitavam…'
        : st.error ? `Od trejda: greška (${esc(st.error)})`
        : sinceT.counted ? `Od trejda <span class="cnt">(${Math.min(...gamesSince.filter(Boolean))}–${Math.max(...gamesSince)} ut.)</span>`
        : 'Od trejda: još nema utakmica';
      return `<div class="hist-team"><div class="hist-tn" style="color:${TEAM_COLORS[ti]}">${esc(t.name)}</div>
        <div class="tscroll"><table><thead><tr><th></th>${CATS.map(catTh).join('')}</tr></thead><tbody>
        ${row(`Snimak <span class="cnt">(${fmtDate(h.date)}, ${per})</span>`, snap)}
        ${row(`Sada <span class="cnt">(${PERIODS.find(x => x.key === nowP).label})</span>`, cur)}
        ${row(sinceLabel, sinceT.counted ? sinceT : null, 'total')}
        </tbody></table></div></div>`;
    }).join('');
    detail = `<div class="hist-detail">
      <div class="hist-dh">Trejd od ${fmtDate(h.date)} <button type="button" class="linkbtn" data-action="hist-close">Zatvori</button></div>
      <p class="hint" style="padding:0 12px">„Od trejda” = prosek samo utakmica posle datuma čuvanja, iz ESPN statistike po utakmici.</p>
      ${blocks}</div>`;
  }

  el.innerHTML = `<details class="card fold" data-fold="hist" ${state.histOpen ? 'open' : ''}>
    <summary><span>Istorija trejdova</span><span class="hint">${state.history.length ? `${state.history.length} sačuvano` : 'prazno'}</span></summary>
    <div class="fold-body">
      ${list ? `<ul class="hist-list">${list}</ul>` : '<div class="empty-team">Još nema sačuvanih trejdova. Klikni „Sačuvaj trejd” ispod rezultata.</div>'}
      ${detail}
    </div></details>`;
}

/* =====================================================================
   Pretraga / autocomplete
   ===================================================================== */
function searchResults(query, taken = takenIds(), prefer = null) {
  const q = norm(query);
  if (!q) return [];
  const tokens = q.split(' ');
  const out = [];
  // Lista je već sortirana po % owned, pa prvi pogoci su najrelevantniji.
  // Prvo oni čije ime/prezime počinje upitom, pa ostali.
  const starts = [], rest = [];
  for (const p of state.players) {
    if (taken.has(p.id)) continue;
    if (!tokens.every(t => p._n.includes(t))) continue;
    (p._n.split(' ').some(w => w.startsWith(tokens[0])) ? starts : rest).push(p);
    if (starts.length >= CONFIG.DROPDOWN_MAX) break;
  }
  out.push(...starts, ...rest);
  // npr. kod "Izbacuješ" na mojoj strani: prvo igrači sa mog rostera
  if (prefer) out.sort((a, b) => prefer.has(b.id) - prefer.has(a.id));
  return out.slice(0, CONFIG.DROPDOWN_MAX);
}

function updateDropdown(key) {
  const inp = document.querySelector(`[data-search="${key}"]`);
  const dd = document.getElementById(`dd-${key}`);
  if (!inp || !dd) return;
  const ui = searchUI.get(key) || { query: '', sel: 0 };
  ui.query = inp.value;
  const results = searchFor(key, ui.query);
  ui.results = results;
  ui.sel = Math.min(ui.sel || 0, Math.max(results.length - 1, 0));
  searchUI.set(key, ui);
  if (!norm(ui.query)) { dd.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  dd.hidden = false;
  inp.setAttribute('aria-expanded', 'true');
  dd.innerHTML = results.length
    ? results.map((p, k) => `<li role="option" data-pick="${p.id}" data-key="${key}" aria-selected="${k === ui.sel}">
        ${avatarHTML(p)}<div><div>${esc(p.name)}</div><div class="meta">${p.team} · ${p.pos} ${injHTML(p)}</div></div></li>`).join('')
    : `<li class="empty">Nema igrača za „${esc(ui.query)}“</li>`;
  dd.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

/** Pretraga zavisi od cilja: roster isključuje samo igrače već na rosteru */
function searchFor(key, query) {
  if (key === 'roster') return searchResults(query, new Set(state.my.roster));
  const [ti, kind] = key.split(':');
  if (kind === 'd' && +ti === state.my.side && state.my.roster.length) return searchResults(query, takenIds(), new Set(state.my.roster));
  return searchResults(query);
}

/** Ključ pretrage -> gde ide igrač: "0" = tim 0 dobija, "0:d" = izbacuje, "0:w" = waiver */
function pickPlayer(key, id) {
  if (key === 'roster') {
    if (!state.my.roster.includes(id)) state.my.roster.push(id);
    saveMy(); searchUI.set(key, { query: '', sel: 0 }); render();
    document.querySelector('[data-search="roster"]')?.focus();
    return;
  }
  if (takenIds().has(id)) return;
  const [tiStr, kind] = key.split(':');
  const ti = +tiStr, team = state.teams[ti];
  if (!team) return;
  if (kind === 'd') team.drops.push(id);
  else if (kind === 'w') team.waivers.push(id);
  else {
    team.ids.push(id);
    if (state.teams.length > 2) team.from[id] = ti === 0 ? 1 : 0;
  }
  searchUI.set(key, { query: '', sel: 0 });
  saveState();
  render();
  // fokus: sledeći slot iste vrste ako postoji, inače glavna pretraga tima
  (document.querySelector(`[data-search="${key}"]`) || document.querySelector(`[data-search="${ti}"]`))?.focus();
}

function removePlayer(ti, kind, id) {
  const t = state.teams[ti];
  if (kind === 'd') t.drops = t.drops.filter(x => x !== id);
  else if (kind === 'w') t.waivers = t.waivers.filter(x => x !== id);
  else { t.ids = t.ids.filter(x => x !== id); delete t.from[id]; }
  saveState();
  render();
}

/* =====================================================================
   Događaji (delegirani)
   ===================================================================== */
document.addEventListener('click', e => {
  const ms = e.target.closest('[data-my-side]');
  if (ms) { state.my.side = +ms.dataset.mySide; saveMy(); render(); return; }
  const pt = e.target.closest('[data-punt]');
  if (pt) { togglePunt(pt.dataset.punt); return; }
  const el = e.target.closest('[data-action],[data-period]');
  if (!el) return;
  if (el.dataset.period) { state.period = el.dataset.period; saveState(); render(); return; }
  const ti = +el.dataset.team;
  switch (el.dataset.action) {
    case 'refresh': loadPlayers(true); loadSchedule(true); break;
    case 'save-trade': saveTrade(); break;
    case 'share': shareLink(el); break;
    case 'hist-open': openTrade(+el.dataset.id); break;
    case 'hist-del': deleteTrade(+el.dataset.id); break;
    case 'hist-close': state.histView = null; render(); break;
    case 'roster-remove': state.my.roster = state.my.roster.filter(id => id !== +el.dataset.id); saveMy(); render(); break;
    case 'remove': removePlayer(ti, el.dataset.kind, +el.dataset.id); break;
    case 'add-team':
      if (state.teams.length < CONFIG.MAX_TEAMS) state.teams.push(newTeam(state.teams.length));
      saveState(); render(); break;
    case 'remove-team':
      state.teams.splice(ti, 1);
      // ispravi "od" indekse posle brisanja tima
      for (const t of state.teams) for (const id in t.from) { if (t.from[id] === ti) delete t.from[id]; else if (t.from[id] > ti) t.from[id]--; }
      searchUI.clear(); saveState(); render(); break;
  }
});

// mousedown (ne click) da blur inputa ne zatvori dropdown pre izbora
document.addEventListener('mousedown', e => {
  const li = e.target.closest('[data-pick]');
  if (!li) return;
  e.preventDefault();
  pickPlayer(li.dataset.key, +li.dataset.pick);
});

document.addEventListener('input', e => {
  if (e.target.dataset.search != null) { const key = e.target.dataset.search; const ui = searchUI.get(key) || {}; ui.sel = 0; searchUI.set(key, ui); updateDropdown(key); }
  if (e.target.dataset.teamName != null) {
    state.teams[+e.target.dataset.teamName].name = e.target.value || TEAM_DEFAULT_NAMES[+e.target.dataset.teamName];
    saveState();
    const totals = state.teams.map(teamTotals), cmp = compare(totals);
    renderScore(totals, cmp); renderCompare(totals, cmp); renderReport(totals, cmp);
  }
});

document.addEventListener('keydown', e => {
  const inp = e.target;
  if (inp.dataset?.search == null) return;
  const key = inp.dataset.search;
  const ui = searchUI.get(key);
  if (!ui || !ui.results) return;
  const n = ui.results.length;
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); ui.sel = (ui.sel + 1) % n; updateDropdown(key); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); ui.sel = (ui.sel - 1 + n) % n; updateDropdown(key); }
  else if (e.key === 'Enter' && n) { e.preventDefault(); pickPlayer(key, ui.results[ui.sel].id); }
  else if (e.key === 'Escape') { inp.value = ''; ui.query = ''; updateDropdown(key); }
});

document.addEventListener('focusout', e => {
  if (e.target.dataset?.search == null) return;
  const dd = document.getElementById(`dd-${e.target.dataset.search}`);
  setTimeout(() => { if (document.activeElement !== e.target && dd) dd.hidden = true; }, 120);
});
document.addEventListener('focusin', e => { if (e.target.dataset?.search != null) updateDropdown(e.target.dataset.search); });
// otvoreno/zatvoreno stanje sklopivih sekcija
document.addEventListener('toggle', e => {
  const f = e.target.dataset?.fold;
  if (f === 'my') { state.my.open = e.target.open; saveMy(); }
  if (f === 'hist') { state.histOpen = e.target.open; }
}, true);
document.addEventListener('change', e => {
  if (e.target.dataset?.from == null) return;
  state.teams[+e.target.dataset.from].from[+e.target.dataset.id] = +e.target.value;
  saveState(); render();
});
window.addEventListener('hashchange', () => { loadState(); render(); });

/* ---------- Tooltip: hover na desktopu, tap na telefonu ([data-tip]) ---------- */
const tipEl = Object.assign(document.createElement('div'), { id: 'tip', hidden: true });
document.body.appendChild(tipEl);
let tipOwner = null;
function showTip(el) {
  tipOwner = el;
  tipEl.textContent = el.dataset.tip;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - 8));
  const top = r.top - t.height - 6 < 8 ? r.bottom + 6 : r.top - t.height - 6;
  tipEl.style.left = `${left}px`; tipEl.style.top = `${top}px`;
}
const hideTip = () => { tipEl.hidden = true; tipOwner = null; };
const canHover = () => matchMedia('(hover: hover)').matches;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tip]');
  // Na touch uređaju drugi tap na isti element zatvara; na desktopu hover već prikazuje.
  if (el && (el !== tipOwner || canHover())) showTip(el); else hideTip();
}, true);
document.addEventListener('mouseover', e => {
  if (!canHover()) return;
  const el = e.target.closest('[data-tip]');
  if (el) showTip(el); else if (tipOwner) hideTip();
});
addEventListener('scroll', hideTip, { passive: true });

/* ===================================================================== */
loadState();
render();
loadPlayers();
loadSchedule();
</script>
